<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>S.PACE CAFE · 美食转盘</title>
<style>
  @font-face {
    font-family: 'Fredoka';
    src: url('fredoka.woff2') format('woff2');
    font-weight: 400 700;
    font-display: swap;
  }
  @font-face {
    font-family: 'Karla';
    src: url('karla.woff2') format('woff2');
    font-weight: 400 700;
    font-display: swap;
  }

  :root{
    --cream:        #FBF1DB;
    --cream-card:   #FFFBF0;
    --espresso:     #3F2B1C;
    --cocoa-muted:  #7C6752;
    --terracotta:   #E2875C;
    --terracotta-d: #C96C43;
    --sage:         #92A77E;
    --sage-d:       #7C9268;
    --butter:       #F3CE7C;
    --butter-d:     #E8BA57;
    --pink:         #FFD0B2;
    --line:         rgba(63,43,28,0.12);

    --font-display: 'Fredoka', 'PingFang SC', 'Microsoft JhengHei', 'Heiti SC', sans-serif;
    --font-body:    'Karla', 'PingFang SC', 'Microsoft JhengHei', 'Heiti SC', sans-serif;
  }

  *{ box-sizing: border-box; }
  html, body { height: 100%; }
  body{
    margin: 0;
    min-height: 100vh;
    background: var(--cream);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(146,167,126,0.16), transparent 42%),
      radial-gradient(circle at 88% 85%, rgba(226,135,92,0.14), transparent 46%);
    color: var(--espresso);
    font-family: var(--font-body);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 16px;
    -webkit-font-smoothing: antialiased;
  }

  .card{
    width: 100%;
    max-width: 460px;
    background: var(--cream-card);
    border: 1px solid var(--line);
    border-radius: 28px;
    padding: 28px 24px 24px;
    box-shadow: 0 1px 2px rgba(63,43,28,0.06), 0 18px 40px -22px rgba(63,43,28,0.35);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  /* ---------- Header ---------- */
  .header{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    text-align: center;
  }
  .brand{
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .brand img{ width: 38px; height: 38px; display: block; }
  .brand-name{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.2rem;
    letter-spacing: 0.01em;
    color: var(--espresso);
  }
  .brand-name small{
    display: block;
    font-weight: 400;
    font-size: 0.68rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--cocoa-muted);
  }
  .tagline{
    font-size: 0.95rem;
    color: var(--cocoa-muted);
    max-width: 30ch;
    text-wrap: balance;
  }
  .tagline strong{ color: var(--espresso); font-weight: 700; }

  /* ---------- Wheel ---------- */
  .wheel-wrap{
    position: relative;
    width: min(78vw, 332px);
    aspect-ratio: 1;
    margin: 6px 0 2px;
  }

  .pointer{
    position: absolute;
    top: -14px;
    left: 50%;
    width: 38px;
    height: 46px;
    transform: translateX(-50%);
    z-index: 5;
    filter: drop-shadow(0 3px 5px rgba(63,43,28,0.35));
  }
  .pointer svg{ width: 100%; height: 100%; display: block; }

  .wheel-ring{
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: var(--espresso);
    box-shadow: 0 16px 30px -14px rgba(63,43,28,0.55);
  }

  .wheel{
    position: absolute;
    inset: 6px;
    border-radius: 50%;
    overflow: hidden;
    background:
      conic-gradient(from 0deg,
        var(--butter) 0deg 60deg,
        var(--sage) 60deg 120deg,
        var(--butter) 120deg 180deg,
        var(--sage) 180deg 240deg,
        var(--butter) 240deg 300deg,
        var(--sage) 300deg 360deg);
    will-change: transform;
  }
  .wheel::after{
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle, transparent 56%, rgba(63,43,28,0.10) 100%);
    pointer-events: none;
  }

  .slice-arm{
    position: absolute;
    inset: 0;
  }
  .slice-content{
    position: absolute;
    top: 10%;
    left: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    width: 25%;
  }
  .dish-img{
    width: 100%;
    display: block;
    filter: drop-shadow(0 3px 5px rgba(63,43,28,0.38));
  }

  .hub{
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 29%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: var(--pink);
    border: 4px solid var(--espresso);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    cursor: pointer;
    z-index: 4;
    padding: 0;
    box-shadow: 0 6px 14px rgba(63,43,28,0.3);
    transition: transform 0.15s ease;
  }
  .hub img{ width: 54%; pointer-events: none; }
  .logo-jump{
    animation: logo-jump 0.7s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes logo-jump{
    0%{ transform: translateY(0) scale(1,1); }
    25%{ transform: translateY(-22%) scale(1.06,0.94); }
    45%{ transform: translateY(0) scale(1.05,0.93); }
    65%{ transform: translateY(-9%) scale(1.02,0.98); }
    100%{ transform: translateY(0) scale(1,1); }
  }
  .hub span{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    color: var(--espresso);
    pointer-events: none;
  }
  .hub:hover{ transform: translate(-50%, -50%) scale(1.045); }
  .hub:active{ transform: translate(-50%, -50%) scale(0.96); }
  .hub:focus-visible{ outline: 3px solid var(--terracotta); outline-offset: 3px; }
  .hub[disabled]{ cursor: default; }
  .hub[disabled]:hover{ transform: translate(-50%, -50%); }

  .hub-ring{
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 2px dashed var(--terracotta);
    opacity: 0;
    pointer-events: none;
  }
  .spinning .hub-ring{
    opacity: 0.85;
    animation: ring-spin 0.9s linear infinite;
  }
  @keyframes ring-spin{ to{ transform: rotate(360deg); } }

  .status{
    min-height: 1.3em;
    font-size: 0.86rem;
    color: var(--cocoa-muted);
    text-align: center;
  }

  /* ---------- Result ---------- */
  .result{
    width: 100%;
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.45s cubic-bezier(0.22,0.9,0.3,1);
  }
  .result.show{ grid-template-rows: 1fr; }
  .result-inner{ overflow: hidden; min-height: 0; }

  .result-card{
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--cream-card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 18px 14px 14px;
    margin-top: 10px;
    opacity: 0;
    transform: scale(0.4) translateY(10px);
    overflow: visible;
  }
  .result.show .result-card{
    animation: pop-in 0.55s cubic-bezier(0.2,1.3,0.4,1) forwards;
  }
  @keyframes pop-in{
    0%{ opacity: 0; transform: scale(0.4) translateY(10px); }
    60%{ opacity: 1; transform: scale(1.06) translateY(0); }
    100%{ opacity: 1; transform: scale(1) translateY(0); }
  }

  .result-burst{
    position: absolute;
    inset: 0;
    z-index: 0;
    border-radius: 20px;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
  }
  .result-burst::before{
    content: "";
    position: absolute;
    inset: -60%;
    background: repeating-conic-gradient(
      var(--butter) 0deg 10deg,
      var(--cream-card) 10deg 20deg
    );
  }
  .result.show .result-burst{
    opacity: 0.6;
    animation: burst-fade-in 0.5s ease forwards;
  }
  .result.show .result-burst::before{
    animation: burst-spin 16s linear infinite;
  }
  @keyframes burst-spin{ from{ transform: rotate(0deg); } to{ transform: rotate(360deg); } }
  @keyframes burst-fade-in{ from{ opacity: 0; } to{ opacity: 0.6; } }

  .result-ribbon{
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    background: var(--terracotta);
    color: #fff;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 0.7rem;
    letter-spacing: 0.04em;
    padding: 4px 16px;
    border-radius: 999px;
    box-shadow: 0 3px 8px rgba(63,43,28,0.3);
    white-space: nowrap;
  }

  .result-photo, .result-text{ position: relative; z-index: 1; }

  .result-photo{
    width: 92px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .result-photo img{
    width: 100%;
    display: block;
    filter: drop-shadow(0 4px 8px rgba(63,43,28,0.35));
  }

  .result-text{ min-width: 0; }
  .result-name-cn{
    font-weight: 700;
    font-size: 1.05rem;
    line-height: 1.25;
    color: var(--espresso);
  }
  .result-name-en{
    font-size: 0.78rem;
    color: var(--cocoa-muted);
    margin-top: 1px;
  }
  .result-price-row{
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 5px;
    flex-wrap: wrap;
  }
  .result-price{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 0.88rem;
    color: var(--cocoa-muted);
    text-decoration: line-through;
    text-decoration-color: rgba(63,43,28,0.45);
  }
  .result-badge{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 0.78rem;
    letter-spacing: 0.01em;
    color: #fff;
    background: var(--terracotta);
    padding: 3px 9px;
    border-radius: 999px;
  }


  .again-btn{
    margin-top: 10px;
    width: 100%;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 0.86rem;
    letter-spacing: 0.02em;
    color: #fff;
    background: var(--terracotta);
    border: none;
    border-radius: 999px;
    padding: 11px 18px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .again-btn:hover{ background: var(--terracotta-d); }
  .again-btn:active{ transform: scale(0.98); }
  .again-btn:focus-visible{ outline: 3px solid var(--sage); outline-offset: 2px; }

  .footer-note{
    font-size: 0.74rem;
    color: var(--cocoa-muted);
    text-align: center;
    font-style: italic;
    opacity: 0.85;
  }

  .confetti{
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: visible;
  }
  .confetti i{
    position: absolute;
    top: 50%;
    left: 50%;
    width: 7px;
    height: 7px;
    border-radius: 2px;
    opacity: 0;
  }
  @keyframes pop{
    0%{ opacity: 1; transform: translate(0,0) rotate(0deg) scale(1); }
    100%{ opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(0.5); }
  }
  .confetti i.go{ animation: pop 0.85s ease-out forwards; }

  @media (prefers-reduced-motion: reduce){
    .wheel{ transition: none !important; }
    .hub-ring{ animation: none !important; }
    .confetti i{ display: none; }
    .logo-jump{ animation: none !important; }
  }

</style>
</head>
<body>

<div class="card">
  <div class="header">
    <div class="brand">
      <img src="mascot.png" alt="" />
      <div class="brand-name">S.PACE CAFE<small>空间咖啡馆 · 美食转盘</small></div>
    </div>
    <p class="tagline">结账后转一下，抽中的餐点<strong>下次光临享15% OFF</strong>！</p>
  </div>

  <div class="wheel-wrap">
    <div class="pointer" aria-hidden="true">
      <svg viewBox="0 0 38 46">
        <path d="M19 46 C 8 32, 2 24, 2 15 A 17 17 0 0 1 36 15 C 36 24, 30 32, 19 46 Z"
              fill="#E2875C" stroke="#FFFBF0" stroke-width="2.5"/>
        <circle cx="19" cy="15" r="5.5" fill="#FFFBF0" opacity="0.9"/>
      </svg>
    </div>

    <div class="wheel-ring"></div>
    <div class="wheel" id="wheel">
      <!-- slice-arm elements injected by JS -->
    </div>

    <button class="hub" id="hub" aria-label="转动转盘 Spin the wheel">
      <span class="hub-ring"></span>
      <img src="mascot-hub.png" alt="" />
      <span>SPIN</span>
    </button>
  </div>

  <p class="status" id="status" aria-live="polite">点一下转盘中间，开始吧</p>

  <div class="result" id="result">
    <div class="result-inner">
      <div class="result-card" id="resultCard">
        <div class="result-burst"></div>
        <div class="confetti" id="confetti"></div>
        <div class="result-ribbon">下次光临 · 专属优惠</div>
        <div class="result-photo"><img id="rPhoto" src="" alt="" /></div>
        <div class="result-text">
          <div class="result-name-cn" id="rNameCn"></div>
          <div class="result-name-en" id="rNameEn"></div>
          <div class="result-price-row">
            <span class="result-price" id="rPrice"></span>
            <span class="result-badge">15% OFF</span>
          </div>
        </div>
      </div>
      <button class="again-btn" id="again">下一位顾客 · Next Guest</button>
    </div>
  </div>

  <p class="footer-note">谢谢你走进这里，让这个空间慢慢有了温度。</p>
</div>

<script>
(function(){
  var items = [
    { code:'R01',  nameCn:'黑胡椒豆腐饭', nameEn:'Black Pepper Tofu Rice', price:'RM 17.80', img:'R01.png'  },
    { code:'B01',  nameCn:'可颂 + 炒蛋',   nameEn:'Croissant + Scrambled Egg', price:'RM 17.20', img:'B01.png' },
    { code:'M01',  nameCn:'番茄酱意大利面', nameEn:'Bolognese Pasta',        price:'RM 16.80', img:'M01.png'  },
    { code:'R04',  nameCn:'日式咖喱蛋包饭', nameEn:'Japanese Curry Katsu',   price:'RM 26.80', img:'R04.png'  },
    { code:'U02',  nameCn:'黑胡椒乌冬面', nameEn:'Black Pepper Udon',      price:'RM 21.80', img:'U02.png'  },
    { code:'M02',  nameCn:'蘑菇酱意大利面', nameEn:'White Sauce Pasta',      price:'RM 16.80', img:'M02.png'  }
  ];

  var SLICE = 360 / items.length;
  var wheel = document.getElementById('wheel');
  var hub = document.getElementById('hub');
  var statusEl = document.getElementById('status');
  var resultEl = document.getElementById('result');
  var resultCard = document.getElementById('resultCard');
  var wrapEl = document.querySelector('.wheel-wrap');

  items.forEach(function(item, i){
    var angle = i * SLICE + SLICE / 2;
    var arm = document.createElement('div');
    arm.className = 'slice-arm';
    arm.style.transform = 'rotate(' + angle + 'deg)';

    var content = document.createElement('div');
    content.className = 'slice-content';
    content.style.transform = 'translateX(-50%) rotate(' + (-angle) + 'deg)';
    content.innerHTML =
      '<img class="dish-img" src="' + item.img + '" alt="' + item.nameCn + '" />';

    arm.appendChild(content);
    wheel.appendChild(arm);
  });

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var currentRotation = 0;
  var spinning = false;

  function burstConfetti(){
    if (reduceMotion) return;
    var host = document.getElementById('confetti');
    host.innerHTML = '';
    var colors = ['#E2875C', '#92A77E', '#F3CE7C', '#3F2B1C', '#FFFBF0'];
    for (var k = 0; k < 20; k++){
      var p = document.createElement('i');
      var ang = Math.random() * Math.PI * 2;
      var dist = 60 + Math.random() * 90;
      p.style.background = colors[k % colors.length];
      if (k % 3 === 0) p.style.borderRadius = '50%';
      p.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      p.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
      p.style.setProperty('--rot', (Math.random() * 360 - 180) + 'deg');
      p.style.animationDelay = (Math.random() * 0.1) + 's';
      host.appendChild(p);
      requestAnimationFrame(function(el){ return function(){ el.classList.add('go'); }; }(p));
    }
  }

  function showResult(item){
    document.getElementById('rPhoto').src = item.img;
    document.getElementById('rNameCn').textContent = item.code + ' · ' + item.nameCn;
    document.getElementById('rNameEn').textContent = item.nameEn;
    document.getElementById('rPrice').textContent = item.price;
    resultEl.classList.add('show');
    burstConfetti();
    setHubLogo('mascot-cheer.png');
    bounceLogos();
  }

  function bounceLogos(){
    var logos = document.querySelectorAll('.hub img, .brand img');
    logos.forEach(function(el){
      el.classList.remove('logo-jump');
      void el.offsetWidth;
      el.classList.add('logo-jump');
    });
  }

  function setHubLogo(src){
    var img = document.querySelector('.hub img');
    if (img) img.src = src;
  }

  function spin(){
    if (spinning) return;
    spinning = true;
    hub.setAttribute('disabled', 'true');
    wrapEl.classList.add('spinning');
    resultEl.classList.remove('show');
    setHubLogo('mascot-hub.png');
    statusEl.textContent = '转动中… 命运正在决定 🎡';

    var targetIndex = Math.floor(Math.random() * items.length);
    var centerAngle = targetIndex * SLICE + SLICE / 2;
    var jitter = (Math.random() * (SLICE * 0.5) - SLICE * 0.25);
    var desiredMod = ((-centerAngle + jitter) % 360 + 360) % 360;
    var extraSpins = 6 + Math.floor(Math.random() * 2);
    var newRotation = currentRotation - (currentRotation % 360) + extraSpins * 360 + desiredMod;

    var duration = reduceMotion ? 0 : (4.3 + Math.random() * 0.4);
    wheel.style.transition = 'transform ' + duration + 's cubic-bezier(0.12,0.72,0.1,1)';
    wheel.style.transform = 'rotate(' + newRotation + 'deg)';
    currentRotation = newRotation;

    var done = function(){
      wheel.removeEventListener('transitionend', done);
      spinning = false;
      hub.removeAttribute('disabled');
      wrapEl.classList.remove('spinning');
      statusEl.textContent = '下一位顾客请点「下一位顾客」再转';
      showResult(items[targetIndex]);
    };

    if (reduceMotion){
      setTimeout(done, 30);
    } else {
      wheel.addEventListener('transitionend', done);
    }
  }

  hub.addEventListener('click', spin);
  document.getElementById('again').addEventListener('click', spin);
})();
</script>
</body>
</html>
